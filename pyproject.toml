[project]
name = "mcp-sentry"
version = "0.1.0"
description = "MCP Server Security Auditor — detect vulnerabilities in Model Context Protocol servers"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0,<2.0",
    "click>=8.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
mcp-sentry = "mcp_sentry.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mcp_sentry", "mcp_sentry.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
